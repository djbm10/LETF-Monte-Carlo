name: Recover sealed holdout prices from raw Yahoo chart

on:
  push:
    branches:
      - research/free-pit-quantconnect-stage1

jobs:
  recover:
    if: contains(github.event.head_commit.message, '[holdout-yahoo-chart-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRIOR_PRICE_RUN: '36267290583'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/free-pit-quantconnect-stage1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests

      - name: Download prior sealed panel and identity inputs
        shell: bash
        run: |
          rm -rf /tmp/prior /tmp/recovered /tmp/audit /tmp/member
          mkdir -p /tmp/prior /tmp/recovered /tmp/audit /tmp/member
          gh run download "$PRIOR_PRICE_RUN" --repo "$GITHUB_REPOSITORY"             --name sealed-holdout-recovered-sp500-prices --dir /tmp/prior
          cp /tmp/prior/recovered/sp500_holdout_recovered_prices_2007_2023.parquet              /tmp/recovered/sp500_holdout_recovered_prices_2007_2023.parquet
          MEMBER_RUN="$(gh run list --repo "$GITHUB_REPOSITORY"             --workflow curated-sp500-membership.yml             --branch research/free-pit-quantconnect-stage1             --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$MEMBER_RUN"
          gh run download "$MEMBER_RUN" --repo "$GITHUB_REPOSITORY"             --name curated-sp500-cik-membership --dir /tmp/member
          curl -L --fail --retry 5             https://raw.githubusercontent.com/thuningxu/sp500nq100/main/sp500_components_history.csv             -o /tmp/curated.csv
          curl -L --fail --retry 5             https://raw.githubusercontent.com/lawcal/sp500-components-history/main/data/components_history.csv             -o /tmp/lawcal.csv

      - name: Fetch raw Yahoo chart JSON for only remaining symbols
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, time
          from pathlib import Path
          import pandas as pd
          import requests

          symbols=[]
          for line in Path('/tmp/prior/recovered/individual_retry_failures.txt').read_text().splitlines():
              if line.strip():
                  symbols.append(line.split('\t',1)[0].strip().upper())

          p1=int(pd.Timestamp('2018-07-01',tz='UTC').timestamp())
          p2=int(pd.Timestamp('2024-01-02',tz='UTC').timestamp())

          def one(sym):
              ys=sym.replace('.','-')
              errors=[]
              for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']:
                  url=f'https://{host}/v8/finance/chart/{ys}'
                  try:
                      r=requests.get(url,params={
                          'period1':p1,'period2':p2,'interval':'1d',
                          'events':'history','includeAdjustedClose':'true'
                      },headers={'User-Agent':'Mozilla/5.0'},timeout=25)
                      if r.status_code!=200:
                          errors.append(f'{host}:HTTP{r.status_code}')
                          continue
                      j=r.json()
                      result=((j.get('chart') or {}).get('result') or [])
                      if not result:
                          errors.append(f'{host}:no_result')
                          continue
                      z=result[0]; ts=z.get('timestamp') or []
                      quote=((z.get('indicators') or {}).get('quote') or [{}])[0]
                      adj=((z.get('indicators') or {}).get('adjclose') or [{}])[0].get('adjclose') or []
                      rows=[]
                      for i,t in enumerate(ts):
                          def get(a):
                              try: return a[i]
                              except Exception: return None
                          close=get(quote.get('close') or [])
                          if close is None: continue
                          rows.append({
                              'Date':pd.to_datetime(t,unit='s',utc=True).tz_convert(None).normalize(),
                              'symbol':sym,
                              'Open':get(quote.get('open') or []),
                              'High':get(quote.get('high') or []),
                              'Low':get(quote.get('low') or []),
                              'Close':close,
                              'Adj Close':get(adj) if adj else close,
                              'Volume':get(quote.get('volume') or []),
                              'source':'YAHOO_RAW_CHART_HOLDOUT_FILL',
                          })
                      df=pd.DataFrame(rows)
                      if len(df):
                          df=df[(df.Date>=pd.Timestamp('2018-07-01'))&(df.Date<=pd.Timestamp('2023-12-31'))]
                          if len(df): return sym,df,None
                      errors.append(f'{host}:empty_rows')
                  except Exception as exc:
                      errors.append(f'{host}:{exc!r}')
              return sym,None,';'.join(errors)

          parts=[]; audit=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for sym,df,err in ex.map(one,symbols):
                  if df is not None:
                      parts.append(df)
                      audit.append({'symbol':sym,'status':'FOUND','rows':len(df)})
                      print('YAHOO_RAW_FOUND',sym,len(df),flush=True)
                  else:
                      audit.append({'symbol':sym,'status':'MISSING','error':err})
                      print('YAHOO_RAW_MISSING',sym,err,flush=True)

          fresh=pd.concat(parts,ignore_index=True) if parts else pd.DataFrame()
          base=pd.read_parquet('/tmp/recovered/sp500_holdout_recovered_prices_2007_2023.parquet')
          ren={}
          for c in base.columns:
              k=str(c).strip().lower()
              if k=='date':ren[c]='Date'
              elif k=='symbol':ren[c]='symbol'
              elif k=='open':ren[c]='Open'
              elif k=='high':ren[c]='High'
              elif k=='low':ren[c]='Low'
              elif k=='close':ren[c]='Close'
              elif k in ('adj close','adj_close','adjusted_close'):ren[c]='Adj Close'
              elif k=='volume':ren[c]='Volume'
          base=base.rename(columns=ren)
          base['Date']=pd.to_datetime(base.Date).dt.normalize()
          base['symbol']=base.symbol.astype(str).str.upper().str.strip().str.replace('-','.',regex=False)
          if 'source' not in base: base['source']='PRIOR_RECOVERED'
          base['_priority']=2
          if len(fresh):
              fresh['_priority']=1
              out=pd.concat([fresh,base],ignore_index=True,sort=False)
          else: out=base
          out=out.sort_values(['symbol','Date','_priority']).drop_duplicates(['symbol','Date'],keep='last')
          out=out.drop(columns=['_priority']).sort_values(['symbol','Date'])
          out.to_parquet('/tmp/recovered/sp500_holdout_recovered_prices_2007_2023.parquet',index=False)
          pd.DataFrame(audit).to_csv('/tmp/recovered/yahoo_raw_recovery_audit.csv',index=False)
          print('YAHOO_RAW_TOTAL',len(fresh),'SYMBOLS',fresh.symbol.nunique() if len(fresh) else 0,flush=True)
          PY

      - name: Enforce unchanged sealed holdout coverage gate
        shell: bash
        run: |
          python research/free_stage1/curated_sp500_price_coverage.py             --curated /tmp/curated.csv             --mapped-membership /tmp/member/curated_sp500_membership_intervals.csv             --lawcal /tmp/lawcal.csv             --prices /tmp/recovered/sp500_holdout_recovered_prices_2007_2023.parquet             --out /tmp/audit             --start 2020-01-01             --end 2023-12-31             --coverage-gate 0.97
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads((Path('/tmp/audit')/'curated_sp500_price_coverage_summary.json').read_text())
          assert s['gate_passed'] is True,s
          print('SEALED_HOLDOUT_YAHOO_RAW_PASS',s['effective_identity_plus_price_coverage'],flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-holdout-yahoo-raw-recovered-prices
          path: |
            /tmp/recovered/
            /tmp/audit/
          if-no-files-found: warn
          retention-days: 30
