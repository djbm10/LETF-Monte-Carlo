name: Actual MES MNQ futures validation
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance
      - run: python -m py_compile research/futures_micro_actual.py
      - run: PYTHONPATH=. python research/futures_micro_actual.py
      - uses: actions/upload-artifact@v4
        with:
          name: futures-micro-actual
          path: results/futures_micro_actual
