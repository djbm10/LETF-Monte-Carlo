name: Build sharded free S&P Bottleneck inputs

on:
  push:
    branches:
      - research/free-pit-quantconnect-stage1
  workflow_dispatch:

jobs:
  fundamentals:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-sharded-bottleneck-inputs]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: a
            acquire_start: 2009
            out_start: 2009
            out_end: 2011
          - id: b
            acquire_start: 2011
            out_start: 2012
            out_end: 2014
          - id: c
            acquire_start: 2014
            out_start: 2015
            out_end: 2017
          - id: d
            acquire_start: 2017
            out_start: 2018
            out_end: 2020
          - id: e
            acquire_start: 2020
            out_start: 2021
            out_end: 2023
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests pyarrow
      - name: Build historical S&P CIK filter
        shell: bash
        run: |
          curl -L --fail --retry 5 \
            https://raw.githubusercontent.com/lawcal/sp500-components-history/main/data/components_history.csv \
            -o /tmp/components_history_fund.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("/tmp/components_history_fund.csv",dtype={"cik":str})
          c=(
              x["cik"].dropna().astype(str)
              .str.replace(r"\.0$","",regex=True).str.zfill(10)
          )
          c=c[c.str.fullmatch(r"\d{10}")]
          open("/tmp/sp500_ciks.txt","w").write("\n".join(sorted(set(c)))+"\n")
          print("S&P CIK FILTER",c.nunique())
          PY
      - name: Build overlapped SEC fundamentals shard
        shell: bash
        run: |
          export SEC_USER_AGENT="LETF-Monte-Carlo research $(git log -1 --pretty=format:'%ae')"
          OUT="/tmp/fund-${{ matrix.id }}"
          python research/free_stage1/sec_fsd_pit.py \
            --start-year ${{ matrix.acquire_start }} \
            --end-year ${{ matrix.out_end }} \
            --quarters 1,2,3,4 \
            --ciks-file /tmp/sp500_ciks.txt \
            --out "$OUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          p=Path("/tmp/fund-${{ matrix.id }}")
          x=pd.read_parquet(p/"sec_pit_fundamentals.parquet")
          d=pd.to_datetime(x["information_date"])
          x=x[(d.dt.year>=${{ matrix.out_start }})&(d.dt.year<=${{ matrix.out_end }})].copy()
          x.to_parquet(p/"trimmed.parquet",index=False)
          m=json.loads((p/"manifest.json").read_text())
          (p/"chunk_manifest.json").write_text(json.dumps({
              "id":"${{ matrix.id }}",
              "acquire_start":${{ matrix.acquire_start }},
              "out_start":${{ matrix.out_start }},
              "out_end":${{ matrix.out_end }},
              "rows":len(x),
              "ciks":int(x.cik.nunique()),
              "failed_quarters":m.get("failed_quarters",[]),
          },indent=2))
          print("FUND_SHARD_PASS","${{ matrix.id }}",len(x),x.cik.nunique())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bottleneck-fund-${{ matrix.id }}
          path: |
            /tmp/fund-${{ matrix.id }}/trimmed.parquet
            /tmp/fund-${{ matrix.id }}/chunk_manifest.json
          retention-days: 7

  network:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-sharded-bottleneck-inputs]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: a
            acquire_start: 2007
            formation_start: 2009-03-31
            formation_end: 2011-12-31
            acquire_end: 2011
          - id: b
            acquire_start: 2010
            formation_start: 2012-03-31
            formation_end: 2014-12-31
            acquire_end: 2014
          - id: c
            acquire_start: 2013
            formation_start: 2015-03-31
            formation_end: 2017-12-31
            acquire_end: 2017
          - id: d
            acquire_start: 2016
            formation_start: 2018-03-31
            formation_end: 2020-12-31
            acquire_end: 2020
          - id: e
            acquire_start: 2019
            formation_start: 2021-03-31
            formation_end: 2023-12-31
            acquire_end: 2023
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn beautifulsoup4 requests pyarrow
      - name: Download PIT membership
        run: |
          curl -L --fail --retry 5 \
            https://raw.githubusercontent.com/lawcal/sp500-components-history/main/data/components_history.csv \
            -o /tmp/components_history.csv
      - name: Build Item 1 network shard
        shell: bash
        run: |
          export SEC_USER_AGENT="LETF-Monte-Carlo research $(git log -1 --pretty=format:'%ae')"
          DATES="$(python - <<'PY'
          import pandas as pd
          a=pd.Timestamp("${{ matrix.formation_start }}")
          b=pd.Timestamp("${{ matrix.formation_end }}")
          d=pd.date_range(a,b,freq="QE")
          print(",".join(x.strftime("%Y-%m-%d") for x in d))
          PY
          )"
          OUT="/tmp/net-${{ matrix.id }}"
          python research/free_stage1/sec_item1_sp500_network.py \
            --membership /tmp/components_history.csv \
            --start-year ${{ matrix.acquire_start }} \
            --end-year ${{ matrix.acquire_end }} \
            --formation-dates "$DATES" \
            --pair-density 0.0205 \
            --max-item1-age-days 550 \
            --rps 4 \
            --out "$OUT"
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path("/tmp/net-${{ matrix.id }}")
          m=json.loads((p/"manifest.json").read_text())
          c=pd.read_csv(p/"membership_network_coverage.csv")
          n=pd.read_csv(p/"network_metrics_all.csv")
          assert len(m["network_runs"])==12, len(m["network_runs"])
          assert len(c)==12, len(c)
          print("NET_SHARD_PASS","${{ matrix.id }}",len(n),int(c.valid_item1_ciks.min()),float(c.valid_item1_ciks.median()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bottleneck-net-${{ matrix.id }}
          path: |
            /tmp/net-${{ matrix.id }}/network_metrics_all.csv
            /tmp/net-${{ matrix.id }}/membership_network_coverage.csv
            /tmp/net-${{ matrix.id }}/manifest.json
          retention-days: 7

  merge:
    needs: [fundamentals, network]
    if: always() && needs.fundamentals.result == 'success' && needs.network.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: bottleneck-fund-*
          path: /tmp/shards
      - uses: actions/download-artifact@v4
        with:
          pattern: bottleneck-net-*
          path: /tmp/shards
      - name: Merge and validate all 60 formations
        shell: bash
        run: |
          mkdir -p results/free_stage1/sp500_bottleneck_inputs_sharded/sec_fundamentals
          mkdir -p results/free_stage1/sp500_bottleneck_inputs_sharded/sec_item1_network
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          shards=Path("/tmp/shards")
          root=Path("results/free_stage1/sp500_bottleneck_inputs_sharded")
          fps=sorted(shards.glob("bottleneck-fund-*/trimmed.parquet"))
          assert len(fps)==5,fps
          parts=[pd.read_parquet(p) for p in fps]
          panel=pd.concat(parts,ignore_index=True)
          panel=panel.sort_values(["cik","information_date","period","adsh"]).drop_duplicates(["adsh","cik"],keep="last")
          panel.to_parquet(root/"sec_fundamentals/sec_pit_fundamentals.parquet",index=False)
          cms=[json.loads(p.read_text()) for p in sorted(shards.glob("bottleneck-fund-*/chunk_manifest.json"))]
          failures=[z for m in cms for z in m.get("failed_quarters",[])]
          assert not failures,failures
          manifest={
              "source":"SEC Financial Statement Data Sets - sharded build",
              "start_year":2009,"end_year":2023,"rows":int(len(panel)),
              "ciks":int(panel.cik.nunique()),"failed_quarters":failures,
              "point_in_time_rule":"information_date = SEC filed date; never use before filed date",
              "evidence_label":"FREE_DISCOVERY",
              "build_mode":"5-way overlapped shards with prior-year warm-up",
          }
          (root/"sec_fundamentals/manifest.json").write_text(json.dumps(manifest,indent=2,default=str))

          dates=pd.date_range("2009-03-31","2023-12-31",freq="QE")
          # Formation features are rebuilt once from the merged PIT panel.
          print("PANEL",len(panel),panel.cik.nunique(),"FORMATIONS",len(dates))
          PY

          DATES="$(python - <<'PY'
          import pandas as pd
          d=pd.date_range("2009-03-31","2023-12-31",freq="QE")
          print(",".join(x.strftime("%Y-%m-%d") for x in d))
          PY
          )"
          python research/free_stage1/sec_formation_features.py \
            --input results/free_stage1/sp500_bottleneck_inputs_sharded/sec_fundamentals/sec_pit_fundamentals.parquet \
            --formation-dates "$DATES" \
            --out results/free_stage1/sp500_bottleneck_inputs_sharded/sec_fundamentals/sec_formation_features.csv

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          shards=Path("/tmp/shards")
          root=Path("results/free_stage1/sp500_bottleneck_inputs_sharded")

          nm_parts=[pd.read_csv(p,dtype={"cik":str}) for p in sorted(shards.glob("bottleneck-net-*/network_metrics_all.csv"))]
          cov_parts=[pd.read_csv(p) for p in sorted(shards.glob("bottleneck-net-*/membership_network_coverage.csv"))]
          n=pd.concat(nm_parts,ignore_index=True).sort_values(["formation_date","cik"])
          cov=pd.concat(cov_parts,ignore_index=True).sort_values("formation_date")
          n.to_csv(root/"sec_item1_network/network_metrics_all.csv",index=False)
          cov.to_csv(root/"sec_item1_network/membership_network_coverage.csv",index=False)

          manifests=[json.loads(p.read_text()) for p in sorted(shards.glob("bottleneck-net-*/manifest.json"))]
          runs=sorted([r for m in manifests for r in m.get("network_runs",[])],key=lambda x:x["formation_date"])
          out=dict(manifests[0])
          out["network_runs"]=runs
          out["start_year"]=2007
          out["end_year"]=2023
          out["build_mode"]="5-way formation shards with >=550-day acquisition warm-up"
          (root/"sec_item1_network/manifest.json").write_text(json.dumps(out,indent=2,default=str))

          f=pd.read_csv(root/"sec_fundamentals/sec_formation_features.csv",dtype={"cik":str})
          assert len(f)>100000,len(f)
          assert (pd.to_datetime(f.information_date)<=pd.to_datetime(f.formation_date)).all()
          assert len(runs)==60,len(runs)
          assert len(cov)==60,len(cov)
          assert cov.valid_item1_ciks.min()>=200,cov.nsmallest(5,"valid_item1_ciks")
          assert cov.valid_item1_ciks.median()>=350,cov.valid_item1_ciks.median()
          assert len(n)>15000,len(n)
          print("SHARDED BOTTLENECK INPUTS PASS",
                "fund_rows",len(f),"network_rows",len(n),
                "min_item1",int(cov.valid_item1_ciks.min()),
                "median_item1",float(cov.valid_item1_ciks.median()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: free-sp500-bottleneck-inputs-sharded
          path: |
            results/free_stage1/sp500_bottleneck_inputs_sharded/sec_fundamentals/sec_formation_features.csv
            results/free_stage1/sp500_bottleneck_inputs_sharded/sec_fundamentals/manifest.json
            results/free_stage1/sp500_bottleneck_inputs_sharded/sec_item1_network/network_metrics_all.csv
            results/free_stage1/sp500_bottleneck_inputs_sharded/sec_item1_network/membership_network_coverage.csv
            results/free_stage1/sp500_bottleneck_inputs_sharded/sec_item1_network/manifest.json
          retention-days: 30
