name: Prospective frozen-signal shadow journal (no trades)
on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC Tue-Sat = prior US trading day late evening.
    - cron: '30 2 * * 2-6'
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public data libraries
        run: python -m pip install 'pandas>=2,<3' 'numpy>=1.26,<3' 'yfinance>=0.2.55' 'exchange_calendars>=4.8,<5'
      - name: Append forward-only signals
        run: python research/free_validation/shadow_signals.py --strict --ledger research/forward_signal_ledger.jsonl
      - name: Commit newly dated observation only
        run: |
          if git status --porcelain -- research/forward_signal_ledger.jsonl | grep .; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add research/forward_signal_ledger.jsonl
            git commit -m 'Record prospectively observed 35/0 and sector signals (no trades)'
            git push origin HEAD:main
          else
            echo 'No new completed session; journal unchanged.'
          fi
