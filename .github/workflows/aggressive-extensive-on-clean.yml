name: Aggressive extensive strategy research
# version: 2026-09-21b

on:
  push:
    branches:
      - research/clean-1926-walkforward
    paths:
      - research/aggressive_strategy_extensive_20260921.py
      - .github/workflows/aggressive-extensive-on-clean.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/clean-1926-walkforward
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
      - name: Compile
        run: python -m py_compile research/aggressive_strategy_extensive_20260921.py
      - name: Run 11-regime research
        run: python research/aggressive_strategy_extensive_20260921.py --paths 2500 --seed 20260921 --output results/aggressive_strategy_extensive_20260921
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aggressive-strategy-extensive-20260921
          path: results/aggressive_strategy_extensive_20260921
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/aggressive_strategy_extensive_20260921
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Persist exhaustive strategy research outputs"
            git push origin HEAD:research/clean-1926-walkforward
          fi
