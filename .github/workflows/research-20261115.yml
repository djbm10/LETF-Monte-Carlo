name: Registered market-data regime simulations (Nov 15)
on:
  push:
    branches: [research/verified-sector-mc-20261115]
    paths:
      - '.github/workflows/research-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies (free source)
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy' 'numba' 'pytest>=8' 'yfinance>=0.2.55' 'requests' 'exchange_calendars>=4.8,<5'
      - name: Run frozen policy integrity and simulation invariants
        run: PYTHONPATH=. python -m pytest -q tests/test_sector_regime.py tests/test_free_data_validation.py
      - name: Run pre-registered real-data paired scenarios; nothing traded
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/registered_sector_20261115
          echo "SCRIPT_SHA=$(git rev-parse HEAD)"
          PYTHONPATH=. python -u research/run_conditional_sector_mc.py \
            --fetch-yahoo --asof 2026-11-13 \
            --years 3,10 --blocks 21,63 \
            --modes current,unconditional --transition-modes semi_markov \
            --funding-spread-bps 100,300 --paths 200 --seed 20261115 \
            --max-scenarios 24 \
            --output results/registered_sector_20261115 \
            | tee results/registered_sector_20261115/console.log
      - name: Upload only model summaries, hashes and logs (not vendor prices)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-real-data-sector-mc-nov15
          path: |
            results/registered_sector_20261115/scenario_results.csv
            results/registered_sector_20261115/manifest.json
            results/registered_sector_20261115/console.log
          retention-days: 45
