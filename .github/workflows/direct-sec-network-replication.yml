name: Complete direct SEC Item1 network replication

on:
  push:
    branches:
      - research/free-pit-quantconnect-stage1

jobs:
  build:
    if: contains(github.event.head_commit.message, '[direct-sec-network-replication]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      FALLBACK_CACHE_RUN: '36245144257'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/free-pit-quantconnect-stage1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install numpy pandas scipy scikit-learn beautifulsoup4 requests pyarrow

      - name: Resolve curated membership and best prior direct-SEC seed
        shell: bash
        run: |
          MEMBER_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow curated-sp500-membership.yml \
            --branch research/free-pit-quantconnect-stage1 \
            --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$MEMBER_RUN" || { echo "No successful curated membership build"; exit 2; }

          PREV_DIRECT_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow direct-sec-network-replication.yml \
            --branch research/free-pit-quantconnect-stage1 \
            --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId')"

          echo "MEMBER_RUN=$MEMBER_RUN" >> "$GITHUB_ENV"
          echo "PREV_DIRECT_RUN=$PREV_DIRECT_RUN" >> "$GITHUB_ENV"
          echo "MEMBER_RUN=$MEMBER_RUN PREV_DIRECT_RUN=$PREV_DIRECT_RUN FALLBACK_CACHE_RUN=$FALLBACK_CACHE_RUN"

      - name: Download best preserved direct-SEC seed and curated membership
        shell: bash
        run: |
          rm -rf /tmp/cache-net /tmp/member /tmp/direct-sec
          mkdir -p /tmp/cache-net /tmp/member /tmp/direct-sec
          if [ -n "$PREV_DIRECT_RUN" ]; then
            gh run download "$PREV_DIRECT_RUN" --repo "$GITHUB_REPOSITORY" \
              --name direct-sec-item1-network-replication --dir /tmp/cache-net
            test -f /tmp/cache-net/direct_sec_filings_all.parquet
            cp /tmp/cache-net/direct_sec_filings_all.parquet /tmp/cache-net/seed_direct_sec_filings.parquet
            echo "SEED_KIND=prior_direct_sec_run" >> "$GITHUB_ENV"
            echo "SEED_RUN=$PREV_DIRECT_RUN" >> "$GITHUB_ENV"
          else
            gh run download "$FALLBACK_CACHE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name cache-only-curated-item1-network --dir /tmp/cache-net
            test -f /tmp/cache-net/cached_sec_filings.parquet
            cp /tmp/cache-net/cached_sec_filings.parquet /tmp/cache-net/seed_direct_sec_filings.parquet
            echo "SEED_KIND=cache_only_curated" >> "$GITHUB_ENV"
            echo "SEED_RUN=$FALLBACK_CACHE_RUN" >> "$GITHUB_ENV"
          fi
          gh run download "$MEMBER_RUN" --repo "$GITHUB_REPOSITORY" \
            --name curated-sp500-cik-membership --dir /tmp/member
          test -f /tmp/member/curated_sp500_membership_intervals.csv
          test -f /tmp/cache-net/seed_direct_sec_filings.parquet

      - name: Complete direct SEC histories and rebuild frozen network
        shell: bash
        run: |
          export SEC_USER_AGENT="LETF-Monte-Carlo research $(git log -1 --pretty=format:'%ae')"
          python research/free_stage1/direct_sec_cache_completion.py \
            --membership /tmp/member/curated_sp500_membership_intervals.csv \
            --cached-sec /tmp/cache-net/seed_direct_sec_filings.parquet \
            --out /tmp/direct-sec \
            --start-year 2007 \
            --end-year 2019 \
            --formation-start 2009-03-31 \
            --formation-end 2019-12-31 \
            --max-item1-age-days 550 \
            --pair-density 0.0205 \
            --rps 4.0

      - name: Upload direct SEC replication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-sec-item1-network-replication
          path: |
            /tmp/direct-sec/network_metrics_all.csv
            /tmp/direct-sec/membership_network_coverage.csv
            /tmp/direct-sec/manifest.json
            /tmp/direct-sec/direct_sec_filings_all.parquet
            /tmp/direct-sec/missing_ciks_before_fetch.txt
            /tmp/direct-sec/cached_snapshot_coverage_before_fetch.csv
          if-no-files-found: warn
          retention-days: 30
