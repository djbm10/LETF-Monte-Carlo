name: Friend safe final
on:
  push:
    branches: ['research/true-dip-tournament']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && PYTHONPATH=. python research/friend_safe_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: friend-safe-final
          path: |
            results/friend_safe_final.csv
            results/friend_safe_final_ranking.csv
