name: True dip reversal screen
on:
  push:
    branches: ['research/true-dip-tournament']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: mkdir -p results && PYTHONPATH=. python research/true_dip_screen.py
      - uses: actions/upload-artifact@v4
        with:
          name: true-dip-screen
          path: |
            results/true_dip_screen.csv
            results/true_dip_frozen.csv
