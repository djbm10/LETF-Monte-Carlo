name: Nasdaq 1985 phase2 hostile confirmation
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: python -m py_compile research/nasdaq1985_phase2_numba.py
      - run: PYTHONPATH=. python research/nasdaq1985_phase2_numba.py
      - uses: actions/upload-artifact@v4
        with:
          name: nasdaq1985-phase2
          path: results/nasdaq1985_phase2
