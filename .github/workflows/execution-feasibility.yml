name: S9 Roth execution feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - research/clean-1926-walkforward
    paths:
      - research/execution_feasibility.py
      - .github/workflows/execution-feasibility.yml
  pull_request:
    branches:
      - main
    paths:
      - research/execution_feasibility.py
      - .github/workflows/execution-feasibility.yml

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance
      - run: python -m py_compile research/execution_feasibility.py
      - run: PYTHONPATH=. python research/execution_feasibility.py
      - uses: actions/upload-artifact@v4
        with:
          name: execution-feasibility
          path: results/execution_feasibility
          if-no-files-found: error
