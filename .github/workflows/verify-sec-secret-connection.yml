name: Temporary SEC secret and API verification
on:
  push:
    branches: [verification/sec-user-agent-20261106]
    paths:
      - .github/workflows/verify-sec-secret-connection.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Verify SEC secret exists and public API can be reached without exposing credentials
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, urllib.request, urllib.error
          ua=os.environ.get("SEC_USER_AGENT","")
          if "@" not in ua or "example.com" in ua:
              print("SECRET_PRESENT=false")
              sys.exit(2)
          print("SECRET_PRESENT=true")
          req=urllib.request.Request(
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json",
              headers={"User-Agent":ua, "Accept":"application/json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=35) as r:
                  print(f"SEC_API_HTTP_STATUS={r.status}")
                  if r.status!=200: sys.exit(3)
                  print("SEC_API_AUTHENTICATED_IDENTIFICATION_WORKING=true")
          except urllib.error.HTTPError as ex:
              print(f"SEC_API_HTTP_STATUS={ex.code}")
              print("SECRET_EXISTS_BUT_SEC_REQUEST_NOT_SUCCESSFUL")
              sys.exit(3)
          except Exception as ex:
              print("SEC_API_NETWORK_REQUEST_FAILED="+type(ex).__name__)
              sys.exit(4)
          PY
