name: Aggressive S9 micro sweep
on:
  push:
    branches: ['research/aggressive-micro-sweep']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && PYTHONPATH=. python research/aggressive_micro_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: aggressive-micro-sweep
          path: |
            results/aggressive_micro_history.csv
            results/aggressive_micro_hostile.csv
            results/aggressive_micro_ranking.csv
