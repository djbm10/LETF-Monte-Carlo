name: Build HF Item1 Bottleneck discovery proxy

on:
  push:
    branches:
      - research/free-pit-quantconnect-stage1

jobs:
  build:
    if: contains(github.event.head_commit.message, '[hf-item1-discovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install duckdb requests numpy pandas scipy scikit-learn pyarrow
      - name: Download PIT membership
        shell: bash
        run: |
          curl -L --fail --retry 5             https://raw.githubusercontent.com/lawcal/sp500-components-history/main/data/components_history.csv             -o /tmp/components_history.csv
      - name: Reconstruct S&P Item 1 filings from public HF parquet
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, duckdb, pandas as pd
          from pathlib import Path

          api='https://datasets-server.huggingface.co/parquet?dataset=JanosAudran%2Ffinancial-reports-sec'
          j=requests.get(api,timeout=60).json()
          files=[
              x['url'] for x in j.get('parquet_files',[])
              if x.get('config')=='large_lite'
          ]
          if len(files)<10:
              raise SystemExit(f'expected large_lite parquet shards, got {len(files)}')
          print('HF_PARQUET_FILES',len(files),'TOTAL_BYTES',sum(x.get('size') or 0 for x in j['parquet_files'] if x.get('config')=='large_lite'))

          m=pd.read_csv('/tmp/components_history.csv',dtype={'cik':str})
          ciks=(
              m.cik.dropna().astype(str).str.replace(r'\.0$','',regex=True)
              .str.zfill(10)
          )
          ciks=sorted(set(ciks[ciks.str.fullmatch(r'\d{10}')]))
          con=duckdb.connect()
          con.execute('INSTALL httpfs; LOAD httpfs;')
          con.register('cik_frame',pd.DataFrame({'cik':ciks}))
          con.execute('CREATE TEMP TABLE wanted_ciks AS SELECT * FROM cik_frame')

          # Print physical schema first; class labels in converted parquet are
          # integer ids (section_1 is id 0 per dataset card), but the predicate
          # tolerates a string representation as well.
          schema=con.execute('DESCRIBE SELECT * FROM read_parquet(?) LIMIT 0',[files[0]]).fetchdf()
          print('HF_SCHEMA',schema.to_dict('records'))

          # DuckDB scans the public parquet shards over HTTP. Filter to the
          # S&P issuer CIKs, the 550-day warm-up window through 2019, and Item 1.
          # Reconstruct each filing by sentenceID order.
          rel=con.execute("""
              SELECT
                  lpad(CAST(p.cik AS VARCHAR),10,'0') AS cik,
                  CAST(p.filingDate AS DATE) AS filing_date,
                  CAST(p.docID AS VARCHAR) AS doc_id,
                  string_agg(CAST(p.sentence AS VARCHAR), ' ' ORDER BY try_cast(p.sentenceID AS BIGINT) NULLS LAST, p.sentenceID) AS item1,
                  count(*) AS sentence_count
              FROM read_parquet(?, union_by_name=true) p
              JOIN wanted_ciks w
                ON lpad(CAST(p.cik AS VARCHAR),10,'0')=w.cik
              WHERE CAST(p.filingDate AS DATE) BETWEEN DATE '2007-09-01' AND DATE '2019-12-31'
                AND (
                    CAST(p.section AS VARCHAR)='0'
                    OR lower(CAST(p.section AS VARCHAR))='section_1'
                )
              GROUP BY 1,2,3
              ORDER BY 2,1,3
          """,[files]).fetchdf()
          print('HF_ITEM1_FILINGS',len(rel),'CIKS',rel.cik.nunique(),
                'MIN',rel.filing_date.min(),'MAX',rel.filing_date.max())
          rel['word_count']=rel.item1.fillna('').str.split().str.len()
          rel['filename']='HF:'+rel.doc_id.astype(str)
          rel['error']=None
          rel=rel[rel.word_count>=250].copy()
          print('HF_VALID_ITEM1_FILINGS',len(rel),'CIKS',rel.cik.nunique())
          Path('/tmp/hf').mkdir(exist_ok=True)
          rel.to_parquet('/tmp/hf/item1_filings.parquet',index=False)
          Path('/tmp/hf/source_manifest.json').write_text(json.dumps({
              'source':'JanosAudran/financial-reports-sec large_lite converted parquet',
              'license':'Apache-2.0 per dataset card',
              'parquet_files':len(files),
              'dataset_server_partial_flag':j.get('partial'),
              'filings_after_filter':int(len(rel)),
              'ciks':int(rel.cik.nunique()),
              'date_min':str(rel.filing_date.min()),
              'date_max':str(rel.filing_date.max()),
              'evidence_label':'FREE_DISCOVERY_HF_ITEM1_PROXY',
          },indent=2,default=str))
          PY
      - name: Build exact frozen TF-IDF network on reconstructed Item 1
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'research/free_stage1')
          import sec_item1_network as net
          import sec_item1_sp500_network as sp

          filings=pd.read_parquet('/tmp/hf/item1_filings.parquet')
          filings['filing_date']=pd.to_datetime(filings.filing_date)
          membership=sp.load_membership(Path('/tmp/components_history.csv'))
          dates=pd.date_range('2009-03-31','2019-12-31',freq='QE')
          out=Path('/tmp/hf/network'); out.mkdir(parents=True,exist_ok=True)
          allm=[]; cov=[]; manifests=[]
          for fd in dates:
              active=sp.active_ciks(membership,fd)
              sample=net.latest_asof(
                  filings[filings.cik.isin(active)],
                  fd,max_age_days=550,
              )
              cov.append({
                  'formation_date':str(fd.date()),
                  'active_ciks':len(active),
                  'valid_item1_ciks':int(sample.cik.nunique()) if len(sample) else 0,
              })
              if len(sample)<20:
                  raise RuntimeError(f'{fd.date()}: only {len(sample)} valid HF Item1 issuers')
              metrics,edges,manifest=net.build_network(sample,fd,pair_density=.0205)
              manifest['universe']='PIT_S_AND_P_500_ISSUER_PROXY'
              manifest['source']='HF financial-reports-sec reconstructed section_1'
              allm.append(metrics); manifests.append(manifest)
              print('HF_NET',fd.date(),'ACTIVE',len(active),'VALID',len(sample),'EDGES',len(edges),flush=True)
          metrics=pd.concat(allm,ignore_index=True).sort_values(['formation_date','cik'])
          coverage=pd.DataFrame(cov)
          metrics.to_csv(out/'network_metrics_all.csv',index=False)
          coverage.to_csv(out/'membership_network_coverage.csv',index=False)
          q={
              'network_runs':manifests,
              'formation_start':str(dates[0].date()),
              'formation_end':str(dates[-1].date()),
              'source':'JanosAudran/financial-reports-sec + frozen TF-IDF builder',
              'evidence_label':'FREE_DISCOVERY_HF_ITEM1_PROXY',
              'warning':'Independent public corpus proxy; raw-SEC network remains authoritative replication.',
          }
          (out/'manifest.json').write_text(json.dumps(q,indent=2,default=str))
          print('HF_NETWORK_COVERAGE','min',int(coverage.valid_item1_ciks.min()),
                'median',float(coverage.valid_item1_ciks.median()),
                'rows',len(metrics))
          if coverage.valid_item1_ciks.min()<200:
              raise SystemExit('HF Item1 minimum coverage below 200')
          if coverage.valid_item1_ciks.median()<350:
              raise SystemExit('HF Item1 median coverage below 350')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-item1-bottleneck-discovery-network
          path: /tmp/hf/
          retention-days: 30
