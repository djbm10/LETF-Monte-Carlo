name: Safe frontier hostile confirmation
on:
  push:
    branches: ['research/true-dip-tournament']
  pull_request:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && PYTHONPATH=. python research/safe_frontier_hostile.py
      - uses: actions/upload-artifact@v4
        with:
          name: safe-frontier-hostile
          path: results/safe_frontier_hostile
