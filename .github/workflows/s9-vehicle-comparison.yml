name: S9 vehicle comparison
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [research/s9_vehicle_comparison.py, .github/workflows/s9-vehicle-comparison.yml]
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas yfinance
      - run: python -m py_compile research/s9_vehicle_comparison.py
      - run: PYTHONPATH=. python research/s9_vehicle_comparison.py
      - uses: actions/upload-artifact@v4
        with:
          name: s9-vehicle-comparison
          path: results/s9_vehicle_comparison
          if-no-files-found: error
