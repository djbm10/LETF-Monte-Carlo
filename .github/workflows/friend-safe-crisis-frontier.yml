name: Friend safe crisis frontier
on:
  push:
    branches: ['research/true-dip-tournament']
  pull_request:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && PYTHONPATH=. python research/friend_safe_crisis_frontier.py
      - uses: actions/upload-artifact@v4
        with:
          name: friend-safe-crisis-frontier
          path: results/friend_safe_crisis_frontier.csv
