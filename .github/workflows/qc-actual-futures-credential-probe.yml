name: QuantConnect actual-futures credential probe

on:
  push:
    branches:
      - research/actual-futures-contract-validation-20261004
    paths:
      - '.github/workflows/qc-actual-futures-credential-probe.yml'
  workflow_dispatch:

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QC_USER_ID: ${{ secrets.QC_USER_ID }}
      QC_API_TOKEN: ${{ secrets.QC_API_TOKEN }}
      QC_ORGANIZATION_ID: ${{ secrets.QC_ORGANIZATION_ID }}
    steps:
      - name: Check required QuantConnect secret presence only
        shell: bash
        run: |
          missing=0
          test -n "$QC_USER_ID" || { echo "MISSING QC_USER_ID"; missing=1; }
          test -n "$QC_API_TOKEN" || { echo "MISSING QC_API_TOKEN"; missing=1; }
          test -n "$QC_ORGANIZATION_ID" || { echo "MISSING QC_ORGANIZATION_ID"; missing=1; }
          test "$missing" -eq 0 || exit 2
          echo "QC_CREDENTIAL_SECRETS_PRESENT"
