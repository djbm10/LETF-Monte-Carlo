name: Confirmed dip hostile fast
on:
  push:
    branches: ['research/nasdaq1985-isolated']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && PYTHONPATH=. python research/confirmed_dip_hostile_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: confirmed-dip-hostile-fast
          path: |
            results/confirmed_dip_hostile_fast.csv
            results/confirmed_dip_hostile_fast_ranking.csv
