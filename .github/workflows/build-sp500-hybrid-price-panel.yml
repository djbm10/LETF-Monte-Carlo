name: Build free hybrid S&P historical price panel

on:
  push:
    branches:
      - research/free-pit-quantconnect-stage1
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-hybrid-sp500-price-panel]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install kaggle pandas pyarrow yfinance requests
      - name: Download PIT membership and public WIKI archive
        shell: bash
        run: |
          unset KAGGLE_USERNAME KAGGLE_KEY KAGGLE_API_TOKEN
          mkdir -p /tmp/hybrid
          curl -L --fail --retry 5 \
            https://raw.githubusercontent.com/lawcal/sp500-components-history/main/data/components_history.csv \
            -o /tmp/hybrid/components_history.csv
          cd /tmp/hybrid
          kaggle datasets download marketneutral/quandl-wiki-prices-us-equites -f WIKI_PRICES.csv
          unzip -o WIKI_PRICES.csv.zip
          test -f WIKI_PRICES.csv
      - name: Build merged WIKI + Yahoo panel and coverage audit
        shell: bash
        run: |
          python - <<'PY'
          import json, random, time
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import requests
          import yfinance as yf

          ROOT=Path("/tmp/hybrid")
          SAMPLE_START=pd.Timestamp("2009-01-01")
          SAMPLE_END=pd.Timestamp("2023-12-31")
          WARMUP_START=pd.Timestamp("2007-12-01")
          DOWNLOAD_END=pd.Timestamp("2024-01-02")

          def norm_symbol(s):
              return str(s).upper().strip().replace("-",".").replace("_",".")

          m=pd.read_csv(ROOT/"components_history.csv",dtype={"cik":str})
          def clean_date(s):
              return pd.to_datetime(
                  s.astype(str).str.replace("*","",regex=False).str.strip()
                  .replace({"":"", "nan":""}),errors="coerce"
              ).dt.normalize()
          m["date_added"]=clean_date(m["date_added"])
          m["date_removed"]=clean_date(m["date_removed"])
          m["symbol"]=m["symbol"].map(norm_symbol)
          m["cik"]=m["cik"].astype(str).str.replace(r"\.0$","",regex=True).str.zfill(10)
          relevant=m[
              (m.date_added<=SAMPLE_END)
              & (m.date_removed.isna() | (m.date_removed>=WARMUP_START))
          ].copy()
          union=sorted(set(relevant.symbol.dropna()))
          wanted=set(union)
          print("MEMBERSHIP_ROWS",len(relevant),"UNION",len(union),flush=True)

          # 1) WIKI EOD: excellent former/delisted-name coverage through 2018-03-27.
          wiki_parts=[]
          for i,chunk in enumerate(pd.read_csv(ROOT/"WIKI_PRICES.csv",chunksize=500_000)):
              chunk.columns=[str(c).lower() for c in chunk.columns]
              chunk["symbol"]=chunk["ticker"].map(norm_symbol)
              x=chunk[chunk.symbol.isin(wanted)].copy()
              if len(x):
                  x["Date"]=pd.to_datetime(x["date"],errors="coerce").dt.normalize()
                  x=x[(x.Date>=WARMUP_START)&(x.Date<=SAMPLE_END)]
                  if len(x):
                      x["Open"]=pd.to_numeric(x.get("open"),errors="coerce")
                      x["High"]=pd.to_numeric(x.get("high"),errors="coerce")
                      x["Low"]=pd.to_numeric(x.get("low"),errors="coerce")
                      x["Close"]=pd.to_numeric(x.get("close"),errors="coerce")
                      x["Adj Close"]=pd.to_numeric(x.get("adj_close"),errors="coerce")
                      x["Volume"]=pd.to_numeric(x.get("volume"),errors="coerce")
                      x["source"]="WIKI"
                      wiki_parts.append(x[["Date","symbol","Open","High","Low","Close","Adj Close","Volume","source"]])
              if i%10==0: print("WIKI_CHUNK",i,flush=True)
          wiki=pd.concat(wiki_parts,ignore_index=True) if wiki_parts else pd.DataFrame()
          print("WIKI_FILTERED",len(wiki),wiki.symbol.nunique() if len(wiki) else 0,flush=True)

          # 2) Yahoo batch history. Current/renamed symbols often preserve the old
          # issuer's full history, so prefer Yahoo on duplicate symbol-dates.
          def ysym(s): return s.replace(".","-")
          inv={ysym(s):s for s in union}
          yp=[]
          yt=list(inv)
          for i in range(0,len(yt),60):
              batch=yt[i:i+60]
              try:
                  z=yf.download(
                      batch,start=WARMUP_START.strftime("%Y-%m-%d"),
                      end=DOWNLOAD_END.strftime("%Y-%m-%d"),
                      auto_adjust=False,actions=False,progress=False,
                      threads=True,group_by="column",
                  )
                  if z is None or z.empty:
                      continue
                  if isinstance(z.columns,pd.MultiIndex):
                      z=z.stack(level=1,future_stack=True).rename_axis(["Date","YahooTicker"]).reset_index()
                  else:
                      z=z.reset_index(); z["YahooTicker"]=batch[0]
                  z["symbol"]=z["YahooTicker"].map(inv)
                  z=z[z.symbol.notna()].copy()
                  if "Close" in z: z=z.dropna(subset=["Close"])
                  if len(z):
                      z["Date"]=pd.to_datetime(z["Date"]).dt.tz_localize(None).dt.normalize()
                      for col in ["Open","High","Low","Close","Adj Close","Volume"]:
                          if col not in z: z[col]=np.nan
                          z[col]=pd.to_numeric(z[col],errors="coerce")
                      z["source"]="YAHOO_BATCH"
                      yp.append(z[["Date","symbol","Open","High","Low","Close","Adj Close","Volume","source"]])
              except Exception as exc:
                  print("YAHOO_BATCH_ERROR",i,repr(exc),flush=True)
              print("YAHOO_BATCH",i,flush=True)
              time.sleep(0.15)
          yahoo=pd.concat(yp,ignore_index=True) if yp else pd.DataFrame()
          print("YAHOO_FILTERED",len(yahoo),yahoo.symbol.nunique() if len(yahoo) else 0,flush=True)

          # Merge source priority: WIKI baseline, Yahoo overwrites duplicate dates.
          frames=[x for x in [wiki,yahoo] if len(x)]
          prices=pd.concat(frames,ignore_index=True)
          prices["priority"]=prices.source.map({"WIKI":1,"YAHOO_BATCH":2}).fillna(0)
          prices=prices.sort_values(["symbol","Date","priority"]).drop_duplicates(["symbol","Date"],keep="last")

          # Real US sessions from SPY.
          spy=yf.download("SPY",start=SAMPLE_START.strftime("%Y-%m-%d"),end=DOWNLOAD_END.strftime("%Y-%m-%d"),auto_adjust=False,progress=False,threads=False)
          sessions=pd.DatetimeIndex(spy.index).tz_localize(None).normalize()

          def coverage_rows(pr):
              price_dates={s:set(g.Date) for s,g in pr.groupby("symbol")}
              rows=[]
              for r in relevant.itertuples(index=False):
                  lo=max(pd.Timestamp(r.date_added),SAMPLE_START)
                  hi=min(pd.Timestamp(r.date_removed) if pd.notna(r.date_removed) else SAMPLE_END,SAMPLE_END)
                  if hi<lo: continue
                  ss=sessions[(sessions>=lo)&(sessions<hi if pd.notna(r.date_removed) else sessions<=hi)]
                  if len(ss)==0: continue
                  dates=price_dates.get(r.symbol,set())
                  covered=sum(d in dates for d in ss)
                  rows.append({
                      "symbol":r.symbol,"cik":r.cik,"date_added":r.date_added,
                      "date_removed":r.date_removed,"member_sessions":len(ss),
                      "covered_sessions":covered,"coverage":covered/len(ss),
                  })
              return pd.DataFrame(rows)

          cov=coverage_rows(prices)
          bad_symbols=sorted(set(cov.loc[cov.coverage<0.97,"symbol"]))
          print("AFTER_WIKI_YAHOO_WEIGHTED",float(cov.covered_sessions.sum()/cov.member_sessions.sum()),"BAD_SYMBOLS",len(bad_symbols),flush=True)

          # 3) Only residual poor-coverage names hit the slower chart endpoint.
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 Chrome/153 Safari/537.36","Accept":"application/json,text/plain,*/*"})
          p1=int(pd.Timestamp(WARMUP_START,tz="UTC").timestamp())
          p2=int(pd.Timestamp(DOWNLOAD_END,tz="UTC").timestamp())

          recovered=[]
          failures={}
          for n,orig in enumerate(bad_symbols,1):
              ticker=ysym(orig); got=None; err=None
              for host in ("query1.finance.yahoo.com","query2.finance.yahoo.com"):
                  for attempt in range(3):
                      try:
                          rr=session.get(
                              f"https://{host}/v8/finance/chart/{ticker}",
                              params={"period1":p1,"period2":p2,"interval":"1d","events":"div,splits","includeAdjustedClose":"true"},
                              timeout=20,
                          )
                          if rr.status_code==429:
                              time.sleep(1.5*(attempt+1)+random.random()); continue
                          if rr.status_code==404: err=f"{host}:404"; break
                          rr.raise_for_status()
                          payload=rr.json(); res=(payload.get("chart") or {}).get("result")
                          if not res: err=str((payload.get("chart") or {}).get("error")); break
                          x=res[0]; ts=x.get("timestamp") or []
                          q=((x.get("indicators") or {}).get("quote") or [{}])[0]
                          adj=((x.get("indicators") or {}).get("adjclose") or [{}])[0].get("adjclose") or [None]*len(ts)
                          rows=[]
                          for j,t in enumerate(ts):
                              vals={k:(q.get(k) or [None]*len(ts))[j] for k in ["open","high","low","close","volume"]}
                              if vals["close"] is None: continue
                              rows.append({
                                  "Date":pd.to_datetime(t,unit="s",utc=True).tz_convert(None).normalize(),
                                  "symbol":orig,"Open":vals["open"],"High":vals["high"],"Low":vals["low"],
                                  "Close":vals["close"],"Adj Close":adj[j] if j<len(adj) and adj[j] is not None else vals["close"],
                                  "Volume":vals["volume"],"source":"YAHOO_CHART",
                              })
                          if rows:
                              got=pd.DataFrame(rows); break
                      except Exception as exc:
                          err=repr(exc)
                  if got is not None: break
              if got is not None:
                  recovered.append(got); print("CHART_RECOVER",orig,len(got),flush=True)
              else:
                  failures[orig]=err; print("CHART_FAIL",orig,err,flush=True)
              if n%10==0: time.sleep(0.5)

          if recovered:
              chart=pd.concat(recovered,ignore_index=True)
              chart["priority"]=3
              prices=pd.concat([prices,chart],ignore_index=True)
              prices=prices.sort_values(["symbol","Date","priority"]).drop_duplicates(["symbol","Date"],keep="last")

          # Normalize and final audit.
          prices=prices[(prices.Date>=WARMUP_START)&(prices.Date<=SAMPLE_END)].copy()
          prices=prices.dropna(subset=["Date","symbol","Close","Adj Close"])
          prices=prices[(prices.Close>0)&(prices["Adj Close"]>0)]
          prices=prices.sort_values(["symbol","Date"])
          cov=coverage_rows(prices)
          weighted=float(cov.covered_sessions.sum()/cov.member_sessions.sum())
          zero=cov[cov.covered_sessions==0].copy()
          partial=cov[(cov.covered_sessions>0)&(cov.coverage<0.95)].copy()
          reused=relevant.groupby("symbol").cik.nunique().loc[lambda x:x>1].sort_values(ascending=False)

          prices.to_parquet(ROOT/"sp500_hybrid_prices_2007_2023.parquet",index=False)
          cov.to_csv(ROOT/"sp500_hybrid_price_coverage.csv",index=False)
          summary={
              "sample_start":str(SAMPLE_START.date()),"sample_end":str(SAMPLE_END.date()),
              "warmup_start":str(WARMUP_START.date()),"membership_rows":int(len(relevant)),
              "membership_union_symbols":int(len(union)),"price_symbols":int(prices.symbol.nunique()),
              "price_rows":int(len(prices)),"source_rows":{str(k):int(v) for k,v in prices.source.value_counts().items()},
              "weighted_member_session_coverage":weighted,
              "completely_missing_membership_rows":int(len(zero)),
              "partial_under_95pct_membership_rows":int(len(partial)),
              "missing_member_sessions":int((cov.member_sessions-cov.covered_sessions).sum()),
              "total_member_sessions":int(cov.member_sessions.sum()),
              "residual_chart_failures":failures,
              "symbols_reused_across_ciks":{str(k):int(v) for k,v in reused.items()},
              "coverage_gate_97pct":bool(weighted>=0.97),
          }
          (ROOT/"sp500_hybrid_price_panel_summary.json").write_text(json.dumps(summary,indent=2,default=str))
          print(json.dumps(summary,indent=2,default=str))
          if weighted < 0.97:
              raise SystemExit(f"HYBRID COVERAGE FAIL {weighted:.6f} < 0.97")
          print("HYBRID PRICE PANEL PASS",weighted,flush=True)
          PY
      - name: Upload hybrid panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-sp500-hybrid-price-panel
          path: |
            /tmp/hybrid/sp500_hybrid_prices_2007_2023.parquet
            /tmp/hybrid/sp500_hybrid_price_coverage.csv
            /tmp/hybrid/sp500_hybrid_price_panel_summary.json
          if-no-files-found: warn
          retention-days: 30
