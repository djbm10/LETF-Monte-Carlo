name: Aggressive final hostile
on:
  pull_request:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && PYTHONPATH=. python research/aggressive_final_hostile.py
      - uses: actions/upload-artifact@v4
        with:
          name: aggressive-final-hostile
          path: |
            results/aggressive_final_hostile.csv
            results/aggressive_final_ranking.csv
