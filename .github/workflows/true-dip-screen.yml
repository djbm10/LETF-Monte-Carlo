name: True dip reversal screen
on:
  push:
    branches: ['research/true-dip-tournament']
  pull_request:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: mkdir -p results && PYTHONPATH=. python research/true_dip_screen_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: true-dip-fast
          path: |
            results/true_dip_fast.csv
            results/true_dip_fast_frozen.csv
