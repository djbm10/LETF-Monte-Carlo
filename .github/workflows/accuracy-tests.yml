name: Financial mechanics regression checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-audit.lock
      - run: python -m pip install -r requirements-audit.lock
      - run: python scripts/check_workflows.py
      - run: python -m pytest -q
      - name: Run portable canonical-account laboratory demo
        run: python -m letf.lab demo --output audit-output/ci-software-fixture
      - name: Verify offline report exists
        run: test -s audit-output/ci-software-fixture/report.html
