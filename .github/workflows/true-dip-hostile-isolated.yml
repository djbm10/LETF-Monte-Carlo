name: True dip hostile isolated
on:
  push:
    branches: ['research/true-dip-hostile-isolated']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba
      - run: mkdir -p results && python research/true_dip_hostile.py
      - uses: actions/upload-artifact@v4
        with:
          name: true-dip-hostile-isolated
          path: |
            results/true_dip_hostile.csv
            results/true_dip_hostile_ranking.csv
