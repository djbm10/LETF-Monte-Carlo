name: Futures fast standalone
on:
  push:
    branches: [ research/futures-fast-run ]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas numba yfinance
      - run: python -m py_compile research/futures_exhaustive_fast.py
      - run: PYTHONPATH=. python research/futures_exhaustive_fast.py --paths 10000
      - uses: actions/upload-artifact@v4
        with:
          name: futures-fast-standalone
          path: results/futures_exhaustive
